<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3a43a">
  <meta name="description" content="La única conexión que necesitas es Jesús.">
  <meta property="og:title" content="WiFi Gratis 📶">
  <meta property="og:description" content="Conéctate con la Iglesia Adventista del Séptimo Día de Riverside.">
  <title>WiFi Gratis | Iglesia Adventista de Riverside</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="./css2" rel="stylesheet">
  <style>
    :root{--brown:#4a2810;--cream:#fff8e6;--gold:#ffd36b}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#f2a038;color:var(--brown);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}.scene{position:relative;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;isolation:isolate;background:radial-gradient(ellipse 70% 55% at 50% 38%,#fff3c4 0%,#ffd27a 30%,transparent 70%),linear-gradient(180deg,#f6b24a,#f2a038 45%,#e3801f)}.glow{position:absolute;inset:-20%;z-index:-4;background:radial-gradient(circle at 50% 40%,rgba(255,250,225,.9),transparent 45%);animation:breathe 6s ease-in-out infinite}.rays{position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;z-index:-3;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,245,210,.23) 0 6deg,transparent 6deg 18deg);mask:radial-gradient(circle,#000 0%,transparent 55%);animation:spin 80s linear infinite}.signal{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;z-index:5;padding:8px 13px;border-radius:999px;background:#fffaebaa;backdrop-filter:blur(7px);font-size:.78rem;font-weight:800;box-shadow:0 6px 20px #7a431829;animation:pop .6s .5s both}.title{position:relative;z-index:3;margin:max(8dvh,calc(env(safe-area-inset-top) + 48px)) 16px 0;display:flex;flex-direction:column;align-items:center;font-family:Cinzel,Georgia,serif;font-weight:700;line-height:.93;text-align:center;text-shadow:0 2px 0 rgba(255,240,200,.5),0 8px 24px rgba(120,60,0,.25)}.title span{display:block;animation:rise-in .75s both}.title .small{font-size:clamp(1.25rem,5vw,2.7rem)}.title .large{font-size:clamp(3rem,13vw,7.4rem);font-weight:900}.title .question{margin:.35em 0 .12em;font-size:clamp(.95rem,4vw,1.85rem);font-weight:500}.title span:nth-child(2){animation-delay:.12s}.title span:nth-child(3){animation-delay:.24s}.title span:nth-child(4){animation-delay:.36s}.jesus{position:absolute;bottom:0;left:50%;z-index:1;width:min(150vw,62dvh * 1.42,900px);max-width:none;height:auto;translate:-50% 0;filter:drop-shadow(0 -6px 30px rgba(255,240,200,.6));user-select:none;animation:jesus-in 1.1s .25s cubic-bezier(.2,.9,.3,1.1) both}.social-actions{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;width:min(92vw,780px);translate:-50%;display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:10px;padding:10px;border:1px solid rgba(255,255,255,.42);border-radius:22px;background:rgba(74,40,16,.84);box-shadow:0 14px 35px rgba(74,40,16,.34);backdrop-filter:blur(12px);animation:pop .6s 1s cubic-bezier(.3,1.6,.5,1) both}.social-link{min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fffaf0;background:rgba(255,255,255,.11);font:700 clamp(.75rem,1.7vw,.9rem)/1.15 Inter,system-ui,sans-serif;text-align:center;text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s}.social-link:first-child{color:var(--brown);background:linear-gradient(180deg,#ffe29b,#f3a43a)}.social-link:hover,.social-link:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.22);box-shadow:0 8px 18px rgba(0,0,0,.18);outline:2px solid var(--cream);outline-offset:2px}.social-link:first-child:hover,.social-link:first-child:focus-visible{background:linear-gradient(180deg,#fff0c6,#f7b653)}.icon{font-size:1.15rem;line-height:1}@keyframes breathe{50%{opacity:.72;transform:scale(1.06)}}@keyframes spin{to{rotate:360deg}}@keyframes rise-in{from{opacity:0;transform:translateY(.7em);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes jesus-in{from{opacity:0;transform:translateY(35%)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
    @media(max-width:700px){.title{margin-top:max(7dvh,calc(env(safe-area-inset-top) + 44px))}.jesus{width:min(160vw,58dvh * 1.42,760px)}.social-actions{grid-template-columns:repeat(2,minmax(0,1fr));width:min(94vw,520px);gap:8px;padding:8px;border-radius:18px}.social-link{min-height:44px;padding:8px 9px}.social-link:first-child{grid-column:1/-1}}
    @media(max-width:390px){.title .large{font-size:clamp(2.5rem,14vw,4rem)}.social-actions{grid-template-columns:1fr;max-height:43dvh;overflow:auto}.social-link:first-child{grid-column:auto}.social-link{min-height:40px}}
    @media(max-height:620px) and (orientation:landscape){.title{margin-top:4dvh;transform:scale(.72);transform-origin:top center}.jesus{width:min(92vw,72dvh * 1.42,700px)}.social-actions{width:min(92vw,820px);grid-template-columns:1.25fr repeat(3,1fr);bottom:7px;padding:6px}.social-link{min-height:38px;padding:6px 8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.social-link{transition:none}}
  </style>
</head>
<body>
  <main class="scene">
    <div class="glow" aria-hidden="true"></div>
    <div class="rays" aria-hidden="true"></div>
    <div class="signal" data-i18n="signal" aria-label="Señal ilimitada">📶 Señal ilimitada</div>
    <h1 class="title" data-i18n-aria="titleAria" aria-label="La única conexión que necesitas es Jesús">
      <span class="small" data-i18n="titleOne">LA ÚNICA</span>
      <span class="large" data-i18n="titleTwo">CONEXIÓN</span>
      <span class="question" data-i18n="titleThree">QUE NECESITAS ES</span>
      <span class="large" data-i18n="titleFour">JESÚS</span>
    </h1>
    <img class="jesus" src="./jesus.webp" data-i18n-alt="imageAlt" alt="Jesús sonriendo y señalando hacia arriba" width="1080" height="760">
    <nav class="social-actions" data-i18n-aria="navAria" aria-label="Enlaces de la Iglesia Adventista de Riverside">
      <a class="social-link" href="https://groupohispanoenriversidemo.adventistchurch.org/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">🌐</span><span data-i18n="website">Ver sitio web</span></a>
      <a class="social-link" href="https://www.youtube.com/@IglesiaAdventista7Riverside" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">▶️</span><span data-i18n="youtube">Seguir en YouTube</span></a>
      <a class="social-link" href="https://www.facebook.com/IglesiaAdventista7Riverside/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">ⓕ</span><span data-i18n="facebook">Seguir en Facebook</span></a>
      <a class="social-link" href="https://www.instagram.com/iglesiaadventista7riverside/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">◎</span><span data-i18n="instagram">Seguir en Instagram</span></a>
    </nav>
  </main>
  <script>
    (() => {
      const translations = {
        es: {
          pageTitle: 'WiFi Gratis | Iglesia Adventista de Riverside',
          description: 'La única conexión que necesitas es Jesús.',
          socialDescription: 'Conéctate con la Iglesia Adventista del Séptimo Día de Riverside.',
          signal: '📶 Señal ilimitada',
          titleAria: 'La única conexión que necesitas es Jesús',
          titleOne: 'LA ÚNICA', titleTwo: 'CONEXIÓN', titleThree: 'QUE NECESITAS ES', titleFour: 'JESÚS',
          imageAlt: 'Jesús sonriendo y señalando hacia arriba',
          navAria: 'Enlaces de la Iglesia Adventista de Riverside',
          website: 'Ver sitio web', youtube: 'Seguir en YouTube', facebook: 'Seguir en Facebook', instagram: 'Seguir en Instagram'
        },
        en: {
          pageTitle: 'Free WiFi | Riverside Adventist Church',
          description: 'The only connection you need is Jesus.',
          socialDescription: 'Connect with the Riverside Seventh-day Adventist Church.',
          signal: '📶 Unlimited signal',
          titleAria: 'The only connection you need is Jesus',
          titleOne: 'THE ONLY', titleTwo: 'CONNECTION', titleThree: 'YOU NEED IS', titleFour: 'JESUS',
          imageAlt: 'Jesus smiling and pointing upward',
          navAria: 'Riverside Adventist Church links',
          website: 'Visit our website', youtube: 'Follow on YouTube', facebook: 'Follow on Facebook', instagram: 'Follow on Instagram'
        }
      };
      const primaryLanguage = (navigator.languages?.[0] || navigator.language || 'es').toLowerCase();
      const language = primaryLanguage.startsWith('en') ? 'en' : 'es';
      const copy = translations[language];
      document.documentElement.lang = language;
      document.title = copy.pageTitle;
      document.querySelector('meta[name="description"]').content = copy.description;
      document.querySelector('meta[property="og:description"]').content = copy.socialDescription;
      document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = copy[element.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-aria]').forEach((element) => { element.setAttribute('aria-label', copy[element.dataset.i18nAria]); });
      document.querySelectorAll('[data-i18n-alt]').forEach((element) => { element.alt = copy[element.dataset.i18nAlt]; });
    })();
  </script>
</body>
</html>
