<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3a43a">
  <meta name="description" content="La única conexión que necesitas es Jesús.">
  <meta property="og:title" content="WiFi Gratis 📶">
  <meta property="og:description" content="Conéctate con la Iglesia Adventista del Séptimo Día de Riverside.">
  <title>WiFi Gratis | Iglesia Adventista de Riverside</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="./css2" rel="stylesheet">
  <style>
    :root { --brown:#4a2810; --cream:#fff8e6; --gold:#ffd36b; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { background:#f2a038; color:var(--brown); font-family:Inter,system-ui,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }

    .connection-loader { position:fixed; inset:0; z-index:100; display:grid; place-content:center; justify-items:center; gap:14px; padding:24px; color:#eef3ff; background:#0f1115; transition:opacity .7s ease, transform .7s ease; }
    .connection-loader.done { opacity:0; transform:scale(1.06); pointer-events:none; }
    .loader-wifi { width:112px; height:auto; fill:none; stroke:#4d5361; stroke-width:8; stroke-linecap:round; }
    .loader-wifi circle { fill:#4d5361; stroke:none; }
    .loader-wifi .bar { animation:wifi-pulse 1.15s infinite; }
    .loader-wifi .bar:nth-child(2) { animation-delay:.15s; }
    .loader-wifi .bar:nth-child(3) { animation-delay:.3s; }
    .loader-wifi .bar:nth-child(4) { animation-delay:.45s; }
    .connection-loader.connected .loader-wifi .bar { animation:none; stroke:#4ade80; }
    .connection-loader.connected .loader-wifi circle { fill:#4ade80; }
    .network-name { margin:0; font-size:1.2rem; font-weight:800; letter-spacing:.015em; }
    .connection-status { min-height:1.4em; margin:0; color:#b9bec9; font-size:.98rem; font-weight:650; }
    .connection-progress { width:190px; height:5px; overflow:hidden; border-radius:99px; background:#292d37; }
    .connection-progress span { display:block; width:100%; height:100%; transform:scaleX(0); transform-origin:left; border-radius:inherit; background:linear-gradient(90deg,#6aa8ff,#4ade80); animation:progress 2.35s cubic-bezier(.55,0,.25,1) forwards; }

    .scene { position:relative; min-height:100dvh; overflow:hidden; display:flex; flex-direction:column; align-items:center; isolation:isolate; background:radial-gradient(ellipse 70% 55% at 50% 38%,#fff3c4 0%,#ffd27a 30%,transparent 70%),linear-gradient(180deg,#f6b24a,#f2a038 45%,#e3801f); }
    .glow { position:absolute; inset:-20%; z-index:-4; background:radial-gradient(circle at 50% 40%,rgba(255,250,225,.9),transparent 45%); animation:breathe 6s ease-in-out infinite; }
    .rays { position:absolute; left:50%; top:38%; width:220vmax; height:220vmax; z-index:-3; translate:-50% -50%; background:repeating-conic-gradient(from 0deg,rgba(255,245,210,.23) 0 6deg,transparent 6deg 18deg); mask:radial-gradient(circle,#000 0%,transparent 55%); animation:spin 80s linear infinite; }
    .signal { position:absolute; top:max(14px,env(safe-area-inset-top)); right:16px; z-index:5; padding:8px 13px; border-radius:999px; background:#fffaebaa; backdrop-filter:blur(7px); font-size:.78rem; font-weight:800; box-shadow:0 6px 20px #7a431829; animation:pop .6s 3.1s both; }
    .title { position:relative; z-index:3; margin:max(8dvh,calc(env(safe-area-inset-top) + 48px)) 16px 0; display:flex; flex-direction:column; align-items:center; font-family:Cinzel,Georgia,serif; font-weight:700; line-height:.93; text-align:center; text-shadow:0 2px 0 rgba(255,240,200,.5),0 8px 24px rgba(120,60,0,.25); }
    .title span { display:block; animation:rise-in .75s both; }
    .title .small { font-size:clamp(1.25rem,5vw,2.7rem); }
    .title .large { font-size:clamp(3rem,13vw,7.4rem); font-weight:900; }
    .title .question { margin:.35em 0 .12em; font-size:clamp(.95rem,4vw,1.85rem); font-weight:500; }
    .title span:nth-child(2) { animation-delay:.12s; }
    .title span:nth-child(3) { animation-delay:.24s; }
    .title span:nth-child(4) { animation-delay:.36s; }

    .jesus-wrap { position:absolute; bottom:-4px; left:50%; z-index:1; width:min(150vw,62dvh * 1.42,900px); translate:-50% 0; animation:jesus-in 1.1s .25s cubic-bezier(.2,.9,.3,1.1) both; pointer-events:none; }
    .jesus { display:block; width:100%; height:auto; filter:drop-shadow(0 -6px 30px rgba(255,240,200,.6)); user-select:none; animation:jesus-float 5s 1.5s ease-in-out infinite; }

    .social-actions { position:absolute; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); z-index:6; width:min(94vw,960px); translate:-50%; display:grid; grid-template-columns:1.25fr repeat(4,1fr); gap:10px; padding:10px; border:1px solid rgba(255,255,255,.42); border-radius:22px; background:rgba(74,40,16,.84); box-shadow:0 14px 35px rgba(74,40,16,.34); backdrop-filter:blur(12px); animation:pop .6s 3.35s cubic-bezier(.3,1.6,.5,1) both; }
    .social-link { min-height:50px; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px; border:1px solid rgba(255,255,255,.2); border-radius:14px; color:#fffaf0; background:rgba(255,255,255,.11); font:700 clamp(.75rem,1.7vw,.9rem)/1.15 Inter,system-ui,sans-serif; text-align:center; text-decoration:none; transition:transform .2s, background .2s, box-shadow .2s; }
    .social-link:first-of-type { color:var(--brown); background:linear-gradient(180deg,#ffe29b,#f3a43a); }
    .social-link:hover, .social-link:focus-visible { transform:translateY(-3px); background:rgba(255,255,255,.22); box-shadow:0 8px 18px rgba(0,0,0,.18); outline:2px solid var(--cream); outline-offset:2px; }
    .social-link:first-of-type:hover, .social-link:first-of-type:focus-visible { background:linear-gradient(180deg,#fff0c6,#f7b653); }
    .icon { font-size:1.15rem; line-height:1; }
    .links-toggle, .links-close { display:none; }

    .confetti-canvas { position:fixed; inset:0; z-index:20; width:100%; height:100%; pointer-events:none; }

    @keyframes wifi-pulse { 0%,100% { stroke:#4d5361; } 45% { stroke:#91b8ff; } }
    @keyframes progress { to { transform:scaleX(1); } }
    @keyframes breathe { 50% { opacity:.72; transform:scale(1.06); } }
    @keyframes spin { to { rotate:360deg; } }
    @keyframes rise-in { from { opacity:0; transform:translateY(.7em); filter:blur(7px); } to { opacity:1; transform:none; filter:blur(0); } }
    @keyframes jesus-in { from { opacity:0; transform:translateY(35%); } to { opacity:1; transform:none; } }
    @keyframes jesus-float { 0%,100% { transform:translateY(0) rotate(-.15deg); } 50% { transform:translateY(-9px) rotate(.2deg); } }
    @keyframes pop { from { opacity:0; transform:translateY(12px) scale(.9); } to { opacity:1; transform:none; } }

    @media (max-width:700px) {
      .title { margin-top:max(7dvh,calc(env(safe-area-inset-top) + 44px)); }
      .jesus-wrap { width:min(160vw,58dvh * 1.42,760px); }
      .social-actions { grid-template-columns:repeat(2,minmax(0,1fr)); width:min(94vw,520px); gap:8px; padding:8px; border-radius:18px; }
      .social-link { min-height:44px; padding:8px 9px; }
      .social-link:first-of-type { grid-column:1/-1; }
    }

    @media (max-width:480px), (max-height:700px) and (orientation:portrait) {
      .title { margin-top:max(8dvh,calc(env(safe-area-inset-top) + 52px)); }
      .title .large { font-size:clamp(2.45rem,14vw,4rem); }
      .jesus-wrap { width:min(170vw,62dvh * 1.42,760px); }
      .links-toggle { position:fixed; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); z-index:8; translate:-50%; min-height:48px; display:flex; align-items:center; justify-content:center; gap:9px; padding:10px 20px; border:1px solid #fff7d466; border-radius:999px; color:#fffaf0; background:linear-gradient(180deg,#6c3a17,#48240e); box-shadow:0 8px 24px #4a281077; font:800 .9rem Inter,system-ui,sans-serif; cursor:pointer; animation:pop .6s 3.35s both; }
      .links-toggle:focus-visible { outline:3px solid #fff4d6; outline-offset:3px; }
      .social-actions { position:fixed; bottom:max(10px,env(safe-area-inset-bottom)); width:min(94vw,430px); max-height:min(72dvh,560px); overflow:auto; grid-template-columns:repeat(2,minmax(0,1fr)); padding:10px; border-radius:22px; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(28px) scale(.96); animation:none; transition:opacity .25s ease, transform .25s ease, visibility .25s; }
      .social-actions.is-open { opacity:1; visibility:visible; pointer-events:auto; transform:none; }
      .links-close { grid-column:1/-1; min-height:38px; display:flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; color:#fffaf0; background:transparent; font:750 .84rem Inter,system-ui,sans-serif; cursor:pointer; }
      .social-link { min-height:48px; }
      .social-link:first-of-type { grid-column:1/-1; }
      .social-actions.is-open + .links-toggle { opacity:0; pointer-events:none; }
    }

    @media (max-width:350px) {
      .social-actions { grid-template-columns:1fr; }
      .social-link:first-of-type, .links-close { grid-column:auto; }
    }

    @media (max-height:620px) and (orientation:landscape) {
      .title { margin-top:4dvh; transform:scale(.72); transform-origin:top center; }
      .jesus-wrap { width:min(92vw,72dvh * 1.42,700px); }
      .social-actions { width:min(96vw,960px); grid-template-columns:1.25fr repeat(4,1fr); bottom:7px; padding:6px; }
      .social-link { min-height:38px; padding:6px 8px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; }
      .social-link, .social-actions { transition:none; }
    }
  </style>
</head>
<body>
  <div class="connection-loader" id="connection-loader" role="status" aria-live="polite">
    <svg class="loader-wifi" viewBox="0 0 100 80" aria-hidden="true">
      <path class="bar" d="M9 31a58 58 0 0 1 82 0"/>
      <path class="bar" d="M21 43a41 41 0 0 1 58 0"/>
      <path class="bar" d="M33 55a24 24 0 0 1 34 0"/>
      <circle class="bar" cx="50" cy="70" r="6"/>
    </svg>
    <p class="network-name">WiFi_Gratis_5G</p>
    <p class="connection-status" id="connection-status" data-i18n="connecting">Conectando…</p>
    <div class="connection-progress" aria-hidden="true"><span></span></div>
  </div>

  <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="scene" id="scene">
    <div class="glow" aria-hidden="true"></div>
    <div class="rays" aria-hidden="true"></div>
    <div class="signal" data-i18n="signal" aria-label="Señal ilimitada">📶 Señal ilimitada</div>
    <h1 class="title" data-i18n-aria="titleAria" aria-label="La única conexión que necesitas es Jesús">
      <span class="small" data-i18n="titleOne">LA ÚNICA</span>
      <span class="large" data-i18n="titleTwo">CONEXIÓN</span>
      <span class="question" data-i18n="titleThree">QUE NECESITAS ES</span>
      <span class="large" data-i18n="titleFour">JESÚS</span>
    </h1>
    <div class="jesus-wrap">
      <img class="jesus" src="./jesus.webp" data-i18n-alt="imageAlt" alt="Jesús sonriendo y señalando hacia arriba" width="1080" height="760">
    </div>
    <nav class="social-actions" id="social-actions" data-i18n-aria="navAria" aria-label="Enlaces de la Iglesia Adventista de Riverside">
      <button class="links-close" id="links-close" type="button"><span aria-hidden="true">✕</span><span data-i18n="closeLinks">Cerrar enlaces</span></button>
      <a class="social-link" href="https://groupohispanoenriversidemo.adventistchurch.org/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">🌐</span><span data-i18n="website">Ver sitio web</span></a>
      <a class="social-link" href="https://www.youtube.com/@IglesiaAdventista7Riverside" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">▶️</span><span data-i18n="youtube">Seguir en YouTube</span></a>
      <a class="social-link" href="https://www.facebook.com/IglesiaAdventista7Riverside/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">ⓕ</span><span data-i18n="facebook">Seguir en Facebook</span></a>
      <a class="social-link" href="https://www.instagram.com/iglesiaadventista7riverside/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">◎</span><span data-i18n="instagram">Seguir en Instagram</span></a>
      <a class="social-link" href="https://maps.app.goo.gl/utc3uumteRJTMJao9" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">📍</span><span data-i18n="directions">Cómo llegar</span></a>
    </nav>
    <button class="links-toggle" id="links-toggle" type="button" aria-expanded="false" aria-controls="social-actions"><span aria-hidden="true">🔗</span><span data-i18n="openLinks">Enlaces</span></button>
  </main>

  <script>
    (() => {
      const translations = {
        es: {
          pageTitle:'WiFi Gratis | Iglesia Adventista de Riverside', description:'La única conexión que necesitas es Jesús.', socialDescription:'Conéctate con la Iglesia Adventista del Séptimo Día de Riverside.',
          connecting:'Conectando…', verifying:'Verificando contraseña…', connected:'¡Conectado! ✅', signal:'📶 Señal ilimitada', titleAria:'La única conexión que necesitas es Jesús',
          titleOne:'LA ÚNICA', titleTwo:'CONEXIÓN', titleThree:'QUE NECESITAS ES', titleFour:'JESÚS', imageAlt:'Jesús sonriendo y señalando hacia arriba', navAria:'Enlaces de la Iglesia Adventista de Riverside',
          website:'Ver sitio web', youtube:'Seguir en YouTube', facebook:'Seguir en Facebook', instagram:'Seguir en Instagram', directions:'Cómo llegar', openLinks:'Enlaces', closeLinks:'Cerrar enlaces'
        },
        en: {
          pageTitle:'Free WiFi | Riverside Adventist Church', description:'The only connection you need is Jesus.', socialDescription:'Connect with the Riverside Seventh-day Adventist Church.',
          connecting:'Connecting…', verifying:'Verifying password…', connected:'Connected! ✅', signal:'📶 Unlimited signal', titleAria:'The only connection you need is Jesus',
          titleOne:'THE ONLY', titleTwo:'CONNECTION', titleThree:'YOU NEED IS', titleFour:'JESUS', imageAlt:'Jesus smiling and pointing upward', navAria:'Riverside Adventist Church links',
          website:'Visit our website', youtube:'Follow on YouTube', facebook:'Follow on Facebook', instagram:'Follow on Instagram', directions:'Get directions', openLinks:'Links', closeLinks:'Close links'
        }
      };

      const primaryLanguage = (navigator.languages?.[0] || navigator.language || 'es').toLowerCase();
      const language = primaryLanguage.startsWith('en') ? 'en' : 'es';
      const copy = translations[language];
      document.documentElement.lang = language;
      document.title = copy.pageTitle;
      document.querySelector('meta[name="description"]').content = copy.description;
      document.querySelector('meta[property="og:description"]').content = copy.socialDescription;
      document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = copy[element.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-aria]').forEach((element) => { element.setAttribute('aria-label', copy[element.dataset.i18nAria]); });
      document.querySelectorAll('[data-i18n-alt]').forEach((element) => { element.alt = copy[element.dataset.i18nAlt]; });

      const loader = document.getElementById('connection-loader');
      const status = document.getElementById('connection-status');
      const canvas = document.getElementById('confetti-canvas');
      const context = canvas.getContext('2d');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const colors = ['#ffd36b','#fff4d6','#f39a2b','#ffffff','#ff9bc6','#8bd3ff'];
      let particles = [];
      let animationFrame = 0;

      const resizeCanvas = () => {
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * ratio);
        canvas.height = Math.round(innerHeight * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      };

      const drawConfetti = () => {
        context.clearRect(0, 0, innerWidth, innerHeight);
        particles = particles.filter((particle) => particle.life > 0);
        particles.forEach((particle) => {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vy += .13;
          particle.vx *= .992;
          particle.rotation += particle.spin;
          particle.life -= 1;
          context.save();
          context.globalAlpha = Math.min(1, particle.life / 30);
          context.translate(particle.x, particle.y);
          context.rotate(particle.rotation);
          context.fillStyle = particle.color;
          context.fillRect(-particle.size / 2, -particle.size / 4, particle.size, particle.size / 2);
          context.restore();
        });
        if (particles.length) animationFrame = requestAnimationFrame(drawConfetti);
        else animationFrame = 0;
      };

      const burst = (x, y, count = 70, power = 8) => {
        if (reducedMotion) return;
        for (let index = 0; index < count; index += 1) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = power * (.45 + Math.random() * .75);
          particles.push({
            x, y, vx:Math.cos(angle) * velocity, vy:Math.sin(angle) * velocity - power * .35,
            size:4 + Math.random() * 7, color:colors[index % colors.length], rotation:Math.random() * Math.PI,
            spin:(Math.random() - .5) * .28, life:70 + Math.random() * 55
          });
        }
        if (!animationFrame) drawConfetti();
      };

      resizeCanvas();
      addEventListener('resize', resizeCanvas, { passive:true });

      setTimeout(() => { status.textContent = copy.verifying; }, 950);
      setTimeout(() => {
        status.textContent = copy.connected;
        loader.classList.add('connected');
      }, 2050);
      setTimeout(() => {
        loader.classList.add('done');
        burst(innerWidth / 2, innerHeight * .34, 150, 10);
        setTimeout(() => burst(innerWidth * .16, innerHeight * .65, 55, 7), 220);
        setTimeout(() => burst(innerWidth * .84, innerHeight * .65, 55, 7), 360);
      }, 2520);
      setTimeout(() => loader.remove(), 3300);

      const actions = document.getElementById('social-actions');
      const toggle = document.getElementById('links-toggle');
      const close = document.getElementById('links-close');
      const setLinksOpen = (open) => {
        actions.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        if (open) close.focus();
        else toggle.focus();
      };
      toggle.addEventListener('click', () => setLinksOpen(true));
      close.addEventListener('click', () => setLinksOpen(false));
      addEventListener('keydown', (event) => { if (event.key === 'Escape' && actions.classList.contains('is-open')) setLinksOpen(false); });

      document.getElementById('scene').addEventListener('pointerdown', (event) => {
        if (event.target.closest('a,button')) return;
        if (actions.classList.contains('is-open')) setLinksOpen(false);
        burst(event.clientX, event.clientY, 42, 6);
      });
    })();
  </script>
</body>
</html>
